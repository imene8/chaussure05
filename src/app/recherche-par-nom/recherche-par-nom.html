<div class="container mt-4">
  <h2>Recherche par nom</h2>

  <form class="form-inline">
    <div class="form-group mb-3">
      <label>Nom de la chaussure</label>
      <input class="form-control" name="searchTerm" [(ngModel)]="searchTerm" placeholder="Tapez un nom..." />
    </div>
  </form>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-bordered table-striped">
        <thead>
          <tr style="background-color: black; color: white;">
            <th style="background-color: black; color: white;">ID</th>
            <th style="background-color: black; color: white;">Nom</th>
            <th style="background-color: black; color: white;">Prix (DT)</th>
            <th style="background-color: black; color: white;">Taille</th>
            <th style="background-color: black; color: white;">Modèle de chaussure</th>
          </tr>
        </thead>
        <tbody>
          @for (c of chaussures | searchFilter: searchTerm; track c.id) {
            <tr>
              <td>{{ c.id }}</td>
              <td>{{ c.nom }}</td>
              <td>{{ c.prix }}</td>
              <td>{{ c.taille }}</td>
              <td>{{ c.modelDeChaussure.nomModel }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center">Aucune chaussure.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
