<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h2>Modifier une chaussure</h2>

      @if (erreur) {
        <div class="alert alert-danger" role="alert" aria-live="polite">{{ erreur }}</div>
      }

      <div class="mb-2">
        <label class="form-label">ID</label>
        <input type="number" class="form-control" name="id" [(ngModel)]="id" disabled />
      </div>

      <div class="mb-2">
        <label class="form-label">Nom</label>
        <input type="text" class="form-control" name="nom" [(ngModel)]="nom" required />
      </div>

      <div class="mb-2">
        <label class="form-label">Prix (DT)</label>
        <input type="number" class="form-control" name="prix" [(ngModel)]="prix" min="0.01" step="0.01" required />
      </div>

      <div class="mb-2">
        <label class="form-label">Taille</label>
        <input type="number" class="form-control" name="taille" [(ngModel)]="taille" min="1" step="1" required />
      </div>

      <div class="mb-2">
        <label class="form-label">Modèle de chaussure</label>
        <select class="form-select" name="idModel" [(ngModel)]="idModel" required>
          @for (m of modeles; track m.idModel) {
            <option [ngValue]="m.idModel">{{ m.nomModel }}</option>
          }
        </select>
      </div>

      <button class="btn btn-warning mt-2" (click)="modifier()">Modifier</button>
      <a class="btn btn-secondary mt-2 ms-2" routerLink="/chaussures">Retour</a>
    </div>
  </div>
</div>
